<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeus Topup - Ultimate Admin Dashboard</title>
  <style>
    :root {
      --bg: #090a0f;
      --card: #131722;
      --card-inner: #1a1f2c;
      --border: #232936;
      --accent: #fde047;
      --accent-hover: #eab308;
      --green: #22c55e;
      --red: #ef4444;
      --text: #ffffff;
      --muted: #8b949e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; }

    /* Security Login Screen */
    #authOverlay {
      position: fixed;
      inset: 0;
      background: #060709;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }
    .login-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .login-box h2 { font-size: 20px; color: var(--accent); margin-bottom: 6px; text-align: center; }
    .login-box p { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 20px; }

    /* Top Nav */
    .top-header {
      background: #0e1118;
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand-wrap { display: flex; align-items: center; gap: 10px; }
    .store-ico { background: #272218; border: 1px solid #4a3b20; color: var(--accent); padding: 6px 10px; border-radius: 8px; font-size: 16px; }
    .titles h1 { font-size: 15px; font-weight: 600; }
    .titles span { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 0.5px; }
    .menu-trigger { background: var(--card-inner); border: 1px solid var(--border); color: #fff; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; }

    /* Sidebar Drawer */
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 150; }
    .sidebar-overlay.open { display: block; }
    .sidebar {
      position: fixed; top: 0; left: -300px; width: 280px; height: 100%;
      background: #0c0e14; border-right: 1px solid var(--border); padding: 16px 10px 40px 10px;
      overflow-y: auto; transition: left 0.25s ease-in-out; z-index: 200;
    }
    .sidebar.open { left: 0; }
    .side-header { display: flex; justify-content: space-between; align-items: center; padding: 0 6px 16px 6px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
    .close-btn { background: var(--card-inner); border: 1px solid #333; color: var(--muted); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 8px; color: var(--muted); font-size: 14px; cursor: pointer; margin-bottom: 3px; }
    .nav-item:hover, .nav-item.active { background: #1f1b14; color: var(--accent); font-weight: 600; }

    /* Page Layout */
    .container { max-width: 760px; margin: 0 auto; padding: 20px 16px; }
    .tab-view { display: none; }
    .tab-view.active { display: block; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
    .card h3 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .card p { font-size: 12px; color: var(--muted); margin-bottom: 14px; }

    /* Inputs */
    label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }
    input[type="text"], input[type="password"], input[type="email"], input[type="number"] {
      width: 100%; padding: 12px 14px; background: var(--card-inner);
      border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 14px; margin-bottom: 14px; outline: none;
    }
    input:focus { border-color: var(--accent); }

    /* Buttons */
    .btn-primary { background: var(--accent); color: #000; font-weight: bold; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 14px; width: 100%; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-send { background: #14532d; color: #86efac; border: 1px solid #166534; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; }

    /* Tables */
    .table-box { overflow-x: auto; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-size: 12px; font-weight: 500; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .badge-pending { background: #3b2a0c; color: var(--accent); border: 1px solid #713f12; }
    .badge-success { background: #052e16; color: #86efac; border: 1px solid #166534; }
  </style>
</head>
