
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Zeus Official Store</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b0f19; color: #f1f5f9; padding: 20px; }
    
    /* Login Card */
    .login-container {
      max-width: 380px;
      margin: 80px auto;
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border: 1px solid #334155;
      text-align: center;
    }
    .login-container h2 { margin-bottom: 20px; font-size: 22px; color: #38bdf8; }
    .input-box {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 15px;
      margin-bottom: 15px;
      outline: none;
    }
    .input-box:focus { border-color: #38bdf8; }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: #0284c7;
      color: #fff;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: #0369a1; }

    /* Admin Panel */
    .dashboard { display: none; max-width: 900px; margin: 20px auto; }
    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid #334155;
    }
    .logout-btn {
      background: #e11d48;
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    .orders-table {
      width: 100%;
      border-collapse: collapse;
      background: #1e293b;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .orders-table th, .orders-table td {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid #334155;
      font-size: 14px;
    }
    .orders-table th { background: #0f172a; color: #94a3b8; font-weight: 600; }
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }
    .badge-pending { background: #854d0e; color: #fef08a; }
    .badge-done { background: #166534; color: #bbf7d0; }
    .action-btn {
      background: #10b981;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s;
    }
    .action-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- লগইন সেকশন -->
  <div id="loginCard" class="login-container">
    <h2>Admin Login</h2>
    <input type="password" id="pinInput" class="input-box" placeholder="পাসওয়ার্ড লিখুন">
    <button class="btn-submit" onclick="login()">প্রবেশ করুন</button>
  </div>

  <!-- অ্যাডমিন ড্যাশবোর্ড সেকশন -->
  <div id="dashboardSection" class="dashboard">
    <div class="dash-header">
      <div>
        <h2 style="color: #38bdf8;">ZEUS Admin Dashboard</h2>
        <p style="font-size: 13px; color: #94a3b8;">অর্ডার ম্যানেজমেন্ট ও কাস্টমার তালিকা</p>
      </div>
      <button class="logout-btn" onclick="logout()">লগআউট</button>
    </div>

    <table class="orders-table">
      <thead>
        <tr>
          <th>User ID</th>
          <th>Zone ID</th>
          <th>প্যাকেজ</th>
          <th>স্ট্যাটাস</th>
          <th>অ্যাকশন</th>
        </tr>
      </thead>
      <tbody id="ordersBody">
        <!-- অর্ডারের রো এখানে লোড হবে -->
      </tbody>
    </table>
  </div>

  <script>
    // ডিফল্ট পাসওয়ার্ড: 1234 (প্রয়োজনে পরিবর্তন করে নিতে পারেন)
    const ADMIN_PASS = "1234";

    function login() {
      const enteredPin = document.getElementById("pinInput").value;
      if (enteredPin === ADMIN_PASS) {
        document.getElementById("loginCard").style.display = "none";
        document.getElementById("dashboardSection").style.display = "block";
        loadDashboardData();
      } else {
        alert("ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।");
      }
    }

    function logout() {
      location.reload();
    }

    function loadDashboardData() {
      // ডেমো অর্ডার তালিকা (পরবর্তীতে ডাটাবেস যোগ হলে স্বয়ংক্রিয়ভাবে আসবে)
      const sampleOrders = [
        { id: 1, userId: "62548912", zoneId: "2105", item: "Weekly Diamond Pass", status: "Pending" },
        { id: 2, userId: "10984712", zoneId: "4012", item: "86 Diamonds", status: "Pending" }
      ];

      const tbody = document.getElementById("ordersBody");
      tbody.innerHTML = "";

      sampleOrders.forEach(order => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td><strong>${order.userId}</strong></td>
          <td>(${order.zoneId})</td>
          <td>${order.item}</td>
          <td><span id="badge-${order.id}" class="status-badge badge-pending">${order.status}</span></td>
          <td>
            <button id="btn-${order.id}" class="action-btn" onclick="processOrder(${order.id}, '${order.userId}', '${order.zoneId}')">
              Send Diamond
            </button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function processOrder(orderId, userId, zoneId) {
      const btn = document.getElementById(`btn-${orderId}`);
      const badge = document.getElementById(`badge-${orderId}`);

      btn.disabled = true;
      btn.innerText = "পাঠানো হচ্ছে...";

      // পরবর্তীতে প্রোভাইডারের API কল এই অংশে বসবে
      setTimeout(() => {
        btn.innerText = "Done ✅";
        btn.style.background = "#475569";
        badge.innerText = "Completed";
        badge.className = "status-badge badge-done";
        alert(`User ID: ${userId} (${zoneId})-এ সফলভাবে ডায়মন্ড পাঠানো হয়েছে!`);
      }, 1500);
    }
  </script>
</body>
</html>
