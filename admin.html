<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeus Topup - Store Admin</title>
  <style>
    :root {
      --bg-dark: #000000;
      --card-bg: #111111;
      --card-inner: #191919;
      --border-color: #262626;
      --accent-yellow: #fde047;
      --accent-yellow-hover: #facc15;
      --text-main: #ffffff;
      --text-muted: #888888;
      --badge-bg: #222222;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

    /* Top Nav */
    .top-header {
      background: #080808;
      border-bottom: 1px solid var(--border-color);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand-group { display: flex; align-items: center; gap: 12px; }
    .store-badge {
      background: #272218;
      border: 1px solid #4a3b20;
      color: #fde047;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 16px;
    }
    .header-titles h1 { font-size: 15px; font-weight: 600; color: #fff; }
    .header-titles span { font-size: 10px; font-weight: 700; letter-spacing: 0.8px; color: var(--text-muted); }
    .menu-btn {
      background: #1a1a1a;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    /* Layout */
    .admin-wrapper { display: flex; flex: 1; position: relative; }

    /* Slide Sidebar */
    .sidebar {
      position: fixed;
      top: 0;
      left: -280px;
      width: 270px;
      height: 100%;
      background: #050505;
      border-right: 1px solid var(--border-color);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: left 0.25s ease-in-out;
      z-index: 200;
      overflow-y: auto;
    }
    .sidebar.open { left: 0; }
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 150;
    }
    .sidebar-overlay.active { display: block; }
    .sidebar-close-btn {
      align-self: flex-end;
      background: #191919;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .nav-item:hover, .nav-item.active {
      background: #191612;
      color: #fff;
    }
    .nav-item.active { font-weight: 600; color: #fde047; }

    /* Main Content */
    .main-body { flex: 1; padding: 20px 16px; max-width: 760px; margin: 0 auto; width: 100%; }

    /* Tab Sections */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Cards */
    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .card-header-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .card-title-group { display: flex; align-items: center; gap: 10px; }
    .card-icon {
      background: #222;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: 15px;
    }
    .card-titles h3 { font-size: 15px; font-weight: 600; }
    .card-titles p { font-size: 12px; color: var(--text-muted); }
    .pill-badge {
      background: var(--badge-bg);
      font-size: 11px;
      padding: 4px 9px;
      border-radius: 20px;
      color: var(--text-muted);
      border: 1px solid #333;
    }
    .pill-badge.live { color: #86efac; border-color: #166534; background: #064e3b; }

    /* Form Fields */
    .field-label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px
