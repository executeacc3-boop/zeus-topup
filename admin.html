<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZEUS OFFICIAL STORE - Master Admin</title>
  <style>
    :root {
      --bg: #090a0d;
      --surface: #12141a;
      --surface-border: #1f232d;
      --gold: #f4e4b5;
      --gold-dark: #d8c28b;
      --green: #22c55e;
      --red: #ef4444;
      --text: #f8fafc;
      --muted: #848995;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 60px; }

    /* AUTH LOCK OVERLAY */
    #lockScreen {
      position: fixed; inset: 0; background: var(--bg); display: flex;
      justify-content: center; align-items: center; z-index: 9999; padding: 20px;
    }
    .lock-card {
      background: var(--surface); border: 1px solid var(--surface-border);
      border-radius: 20px; padding: 30px; width: 100%; max-width: 360px;
      text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.8);
    }
    .lock-logo { font-size: 28px; margin-bottom: 8px; }
    .lock-card h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .lock-card p { font-size: 13px; color: var(--muted); margin-bottom: 22px; }
    .pin-input {
      width: 100%; background: #060709; border: 1px solid var(--surface-border);
      color: #fff; padding: 14px; font-size: 16px; border-radius: 12px;
      text-align: center; letter-spacing: 4px; margin-bottom: 14px; outline: none;
    }
    .pin-input:focus { border-color: var(--gold); }
    .btn-gold {
      width: 100%; background: var(--gold); color: #000; font-weight: 700;
      border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-size: 14px;
      transition: 0.2s;
    }
    .btn-gold:hover { background: var(--gold-dark); }

    /* HEADER */
    header {
      background: #0d0f14; border-bottom: 1px solid var(--surface-border);
      padding: 14px 20px; display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100;
    }
    .header-brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; color: var(--gold); }
    .btn-logout {
      background: none; border: 1px solid #3b1d24; color: var(--red);
      padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
    }

    /* TOP NAVIGATION TABS */
    .nav-bar {
      display: flex; gap: 8px; padding: 14px 16px; overflow-x: auto;
      max-width: 600px; margin: 0 auto; scrollbar-width: none;
    }
    .nav-pill {
      background: var(--surface); border: 1px solid var(--surface-border);
      color: var(--muted); padding: 9px 16px; border-radius: 10px;
      font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .nav-pill.active { background: #1c202a; border-color: var(--gold); color: #fff; }

    /* CONTENT WRAPPER */
    .container { max-width: 600px; margin: 0 auto; padding: 0 16px; }

    /* CARDS & UI */
    .card {
      background: var(--surface); border: 1px solid var(--surface-border);
      border-radius: 16px; padding: 18px; margin-bottom: 14px;
    }
    .card-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .card-subtitle { font-size: 12px; color: var(--muted); margin-bottom: 14px; }

    /* STATS GRID */
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
    .stat-tile {
      background: #0a0b0f; border: 1px solid var(--surface-border);
      border-radius: 12px; padding: 14px; text-align: center;
    }
    .stat-val { font-size: 20px; font-weight: 800; color: var(--gold); margin-top: 4px; }
    .stat-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; }

    /* FORM ELEMENTS */
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .field input {
      width: 100%; background: #060709; border: 1px solid var(--surface-border);
      color: #fff; padding: 12px 14px; border-radius: 10px; font-size: 14px; outline: none;
    }
    .field input:focus { border-color: var(--gold); }

    /* TOGGLE SWITCH ROW */
    .switch-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
    .switch-desc h4 { font-size: 14px; font-weight: 600; }
    .switch-desc p { font-size: 12px; color: var(--muted); }
