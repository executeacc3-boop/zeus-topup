<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeus Topup - Store Admin</title>
  <style>
    :root {
      --bg: #0b0c0e;
      --card-bg: #141518;
      --border: #23252a;
      --gold: #f4e4b5;
      --green: #22c55e;
      --text: #ffffff;
      --muted: #8b8e98;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 50px; }

    /* Login */
    #loginBox { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: 100%; max-width: 360px; }
    .inp { width: 100%; background: #08090a; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 8px; margin: 8px 0 16px 0; outline: none; }
    .btn-gold { background: var(--gold); color: #000; font-weight: 700; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; }

    /* Dashboard */
    #adminPanel { display: none; }
    header { background: #101115; border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
    .btn-icon { background: #1c1e24; border: 1px solid var(--border); color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 16px; }
    
    /* Side Drawer */
    .drawer { position: fixed; top: 0; left: -280px; width: 260px; height: 100%; background: #08090b; border-right: 1px solid var(--border); transition: 0.3s; z-index: 100; padding: 20px; }
    .drawer.open { left: 0; }
    .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; z-index: 90; }
    .backdrop.open { display: block; }
    .menu-item { padding: 12px; color: var(--muted); border-radius: 8px; cursor: pointer; margin-bottom: 6px; }
    .menu-item.active, .menu-item:hover { background: #1a1b22; color: #fff; }

    /* Content */
    .container { padding: 20px 16px; max-width: 500px; margin: 0 auto; }
    .box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
    .row { display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginBox">
    <div class="card">
      <h2 style="text-align:center; margin-bottom: 4px;">⚡ Zeus Admin</h2>
      <p style="text-align:center; font-size: 13px; color: var(--muted); margin-bottom: 20px;">Control Dashboard</p>
      
      <label style="font-size: 13px;">Gmail ID</label>
      <input type="email" id="uEmail" class="inp" placeholder="admin@gmail.com">
      
      <label style="font-size: 13px;">Password</label>
      <input type="password" id="uPass" class="inp" placeholder="123456">

      <button class="btn-gold" onclick="login()">Login</button>
      <div id="err" style="color:#ef4444; font-size:12px; text-align:center; margin-top:10px; display:none;">Email ba Password bhul!</div>
    </div>
  </div>

  <!-- ADMIN MAIN PANEL -->
  <div id="adminPanel">
    <header>
      <button class="btn-icon" onclick="openMenu(true)">☰</button>
      <b style="color:var(--gold);">Zeus Topup Admin</b>
      <button onclick="logout()" style="background:none; border:1px solid #ef4444; color:#ef4444; padding:5px 10px; border-radius:6px; cursor:pointer;">Logout</button>
    </header>

    <div id="backdrop" class="backdrop" onclick="openMenu(false)"></div>
    <div id="drawer" class="drawer">
      <div class="row" style="margin-bottom: 20px;">
        <h3>Menu</h3>
        <button onclick="openMenu(false)" style="background:none; border:none; color:#fff; font-size:18px;">✕</button>
      </div>
      <div class="menu-item active" onclick="showTab('orders', this)">📦 Orders</div>
      <div class="menu-item" onclick="showTab('payments', this)">₹ Payments (UPI)</div>
      <div class="menu-item" onclick="showTab('apis', this)">⚙️ Provider API</div>
    </div>

    <div class="container">
      
      <!-- ORDERS TAB -->
      <div id="tab-orders">
        <h3 style="margin-bottom: 12px;">Customer Orders</h3>
        <div id="orderList" class="box" style="text-align:center; color:var(--muted);">Kono notun order nei</div>
      </div>

      <!-- PAYMENTS TAB -->
      <div id="tab-payments" style="display:none;">
        <h3 style="margin-bottom: 12px;">₹ Payment Settings</h3>
        <div class="box">
          <label style="font-size: 13px;">Your UPI ID</label>
          <input type="text" id="upiId" class="inp" placeholder="9832580722@ptyest">
          <button class="btn-gold" onclick="saveUpi()">Save UPI</button>
        </div>
      </div>

      <!-- APIS TAB -->
      <div id="tab-apis" style="display:none;">
        <h3 style="margin-bottom: 12px;">⚙️ Provider API</h3>
        <div class="box">
          <h4>🔑 Busan Official API</h4>
          <input type="password" id="apiKey" class="inp" placeholder="Busan API Key din" style="margin-top:10px;">
          <button class="btn-gold" onclick="saveApi()">Save API Key</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    function login() {
      const e = document.getElementById('uEmail').value.trim();
      const p = document.getElementById('uPass').value.trim();
      if(e === 'admin@gmail.com' && p === '123456') {
        sessionStorage.setItem('isLogged', 'true');
        startDashboard();
      } else {
        document.getElementById('err').style.display = 'block';
      }
    }

    function logout() {
      sessionStorage.clear();
      location.reload();
    }

    function startDashboard() {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
      loadData();
    }
