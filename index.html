<!-- MLBB ID Input Section -->
<div class="input-group" style="max-width: 400px; margin: 20px auto; font-family: sans-serif;">
  <label style="font-weight: bold; display: block; margin-bottom: 5px;">Player Verification</label>
  
  <div style="display: flex; gap: 10px; margin-bottom: 10px;">
    <input 
      type="text" 
      id="userIdInput" 
      placeholder="User ID (e.g. 12345678)" 
      style="flex: 2; padding: 10px; border-radius: 6px; border: 1px solid #ccc;"
    >
    <input 
      type="text" 
      id="zoneIdInput" 
      placeholder="Zone ID (e.g. 1234)" 
      style="flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #ccc;"
    >
  </div>

  <!-- Verification Message / In-Game Name -->
  <div id="idStatus" style="font-size: 14px; margin-bottom: 15px; font-weight: 500;"></div>

  <!-- Order Submit Button -->
  <button 
    id="orderBtn" 
    onclick="submitOrder()" 
    disabled 
    style="width: 100%; padding: 12px; background-color: #777; color: white; border: none; border-radius: 6px; cursor: not-allowed; font-size: 16px; font-weight: bold;"
  >
    Confirm Order
  </button>
</div>

<script>
const userIdInput = document.getElementById("userIdInput");
const zoneIdInput = document.getElementById("zoneIdInput");
const idStatus = document.getElementById("idStatus");
const orderBtn = document.getElementById("orderBtn");

let verifiedUsername = null;

// ইউজার দুটি ফিল্ড টাইপ করে শেষ করলে স্বয়ংক্রিয়ভাবে নাম চেক করবে
userIdInput.addEventListener("blur", checkPlayerId);
zoneIdInput.addEventListener("blur", checkPlayerId);

async function checkPlayerId() {
  const userId = userIdInput.value.trim();
  const zoneId = zoneIdInput.value.trim();

  // দুটি ফিল্ডেই ইনপুট না থাকলে কল করবে না
  if (!userId || !zoneId) {
    idStatus.innerHTML = "";
    disableOrderBtn();
    return;
  }

  idStatus.style.color = "#0070f3";
  idStatus.innerHTML = "⏳ Verifying account...";

  try {
    const res = await fetch("/api/check-id", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId, zoneId })
    });

    const data = await res.json();

    if (res.ok && data.success) {
      verifiedUsername = data.username;
      idStatus.style.color = "#00a854";
      idStatus.innerHTML = `✓ Username: <strong>${data.username}</strong>`;
      enableOrderBtn();
    } else {
      verifiedUsername = null;
      idStatus.style.color = "#f5222d";
      idStatus.innerHTML = `✕ ${data.message || "Invalid User ID or Zone ID!"}`;
      disableOrderBtn();
    }
  } catch (err) {
    idStatus.style.color = "#f5222d";
    idStatus.innerHTML = "✕ Verification service unavailable.";
    disableOrderBtn();
  }
}

function enableOrderBtn() {
  orderBtn.disabled = false;
  orderBtn.style.backgroundColor = "#28a745";
  orderBtn.style.cursor = "pointer";
}

function disableOrderBtn() {
  orderBtn.disabled = true;
  orderBtn.style.backgroundColor = "#777";
  orderBtn.style.cursor = "not-allowed";
}

async function submitOrder() {
  if (!verifiedUsername) {
    alert("Please enter a valid Player ID & Zone ID first!");
    return;
  }

  const orderData = {
    userId: "zeus-customer-01",
    productId: "mlbb_pass",
    playerId: userIdInput.value.trim(),
    zoneId: zoneIdInput.value.trim(),
    playerName: verifiedUsername
  };

  try {
    const res = await fetch("/api/order", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(orderData)
    });

    const data = await res.json();

    if (res.ok) {
      alert("Order Successful for " + verifiedUsername + "!");
    } else {
      alert("Order Failed: " + (data.error || "Could not complete order."));
    }
  } catch (err) {
    alert("Server error processing order.");
  }
}
</script>
